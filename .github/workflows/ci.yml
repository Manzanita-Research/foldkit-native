name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Blacksmith is organization-only. Keep upstream's provisioned runners;
  # forks use standard GitHub-hosted runners without additional setup.
  # Headless: FoldKit in happy-dom, the mirror against a fake GPUI tree. No
  # GPU, no window. test/native/* skips itself off macOS.
  unit:
    runs-on: ${{ github.repository == 'Manzanita-Research/foldkit-native' && 'blacksmith-2vcpu-ubuntu-2404' || 'ubuntu-24.04' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.9
      - run: npm ci
      - run: bun run typecheck
      - run: bun run css --check
      - run: npm run check:release
      - run: bun test
      # The examples again on the DOM mirror, the comparator: the run above
      # takes each example's own renderer (FoldKit on gpuix, once ported).
      - run: bun test ./examples
        env:
          FOLDKIT_NATIVE_RENDERER: mirror

  # Real GPUI on Metal: offscreen (gpuix's TestRenderer) and in real windows
  # driven through gpuix's automation channel.
  macos:
    runs-on: ${{ github.repository == 'Manzanita-Research/foldkit-native' && 'blacksmith-6vcpu-macos-15' || 'macos-15' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.9
      - run: npm ci
      - run: bun test
        env:
          FOLDKIT_NATIVE_EVIDENCE: evidence
      # Every example drawn by Metal: the screenshots its native.test.ts took.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: example-screenshots
          path: evidence/
          if-no-files-found: ignore
