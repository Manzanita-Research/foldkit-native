name: Nightly numbers

# The performance table (bench/README.md): FoldKit on gpuix in real windows on
# Metal, against bench/baseline.macos-ci.json. Nightly at 07:17 UTC: Jem
# approved the Blacksmith minutes (about 10 a night) on Oct 4 (FKN-26).
# Pixel Art is left out on macOS until its theme list paints on the adapter
# (FKN-25); add it back to --apps then.
on:
  schedule: [{ cron: '17 7 * * *' }]
  workflow_dispatch:
    inputs:
      record:
        description: Record a new baseline for this runner class instead of comparing
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  numbers:
    runs-on: blacksmith-6vcpu-macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.9
      - run: npm ci
      - name: Measure
        env:
          RECORD: ${{ github.event_name == 'workflow_dispatch' && inputs.record && '--record' || '' }}
        run: |
          set +e
          bun scripts/nightly.ts --class macos-ci --apps counter,big-list --out nightly.json $RECORD > nightly.md
          status=$?
          cat nightly.md >> "$GITHUB_STEP_SUMMARY"
          exit $status
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: nightly-numbers
          path: |
            nightly.json
            nightly.md
            bench/baseline.macos-ci.json
          if-no-files-found: ignore
