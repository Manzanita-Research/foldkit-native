name: Release

# Source releases only. Registry publication is a separate future capability.
on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]

concurrency:
  group: release-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.22.3
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.9
      - name: Verify exact successful current-main CI before dependency installation
        run: node scripts/release.mjs check
      - run: npm ci --ignore-scripts
      - name: Recheck current main before version PR automation
        run: node scripts/release.mjs check
      - name: Create or update repository version PR
        id: changesets
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1
        with:
          version: npm run version:packages
          title: Version FoldKit Native source release
          commit: Version FoldKit Native source release
          branch: main
          createGithubReleases: false
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Create GitHub source tag and release
        if: steps.changesets.outputs.hasChangesets == 'false'
        run: npm run release:github
